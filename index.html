<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find PC games, compare prices, and discover deals across game stores.">
  <title>Find the Game | Game Deals</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/">FIND THE GAME</a>
      <nav aria-label="Main navigation">
        <a href="/" aria-current="page">Home</a>
        <a href="/deals.html">Deals</a>
        <a href="/favorites.html">Favorites</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <h1>Find Your Next Game</h1>
      <p>Discover games and compare current PC deals.</p>
      <form id="search-form" class="search-form">
        <label class="sr-only" for="search-input">Search for a game</label>
        <input id="search-input" type="search" placeholder="Search for a game..." required>
        <button type="submit">Search</button>
      </form>
    </section>
    <section class="results-section" aria-labelledby="results-title">
      <div class="results-header">
        <h2 id="results-title">Discover Games</h2>
        <div class="filters">
          <label for="genre-filter">Genre</label>
          <select id="genre-filter">
            <option value="all">All Genres</option>
            <option value="action">Action</option>
            <option value="adventure">Adventure</option>
            <option value="role-playing-games-rpg">RPG</option>
            <option value="strategy">Strategy</option>
            <option value="shooter">Shooter</option>
          </select>
          <label for="sort-filter">Sort</label>
          <select id="sort-filter">
            <option value="default">Default</option>
            <option value="rating">Highest Rating</option>
            <option value="name">Name A-Z</option>
            <option value="price">Lowest Deal Price</option>
          </select>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">Loading games...</p>
      <div id="game-container" class="game-grid" aria-label="Game results"></div>
    </section>
  </main>
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Find the Game | Data from RAWG and CheapShark</p>
  </footer>
</body>
</html>
